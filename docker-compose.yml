services:
  bot:
    build: .
    image: ${BOT_IMAGE:-nutrition-bot:local}
    init: true
    restart: unless-stopped
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.sqlite3
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

volumes:
  bot-data:
