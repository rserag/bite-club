name: Bite Club checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.2'
      - run: uv sync --locked --group e2e
      - run: uv run --no-sync python scripts/audit_publication.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest tests tools/telegram_e2e/tests -q
      - name: Credential-free synthetic demo
        run: uv run --no-sync python scripts/demo.py
      - name: Build source and wheel distributions
        run: uv build
  container:
    name: Container persistence and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag bite-club:ci .
      - name: Non-root container and offline migration smoke test
        run: bash scripts/container-smoke.sh bite-club:ci
      - name: Compose validation with placeholders only
        env:
          BOT_ENV_FILE: .env.example
        run: docker compose config --quiet
