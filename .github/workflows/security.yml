name: Bite Club security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable public history with redacted output
        run: |
          docker run --rm -v "$PWD:/source:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/source \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /source --config /source/.gitleaks.toml --redact --no-banner --no-color \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          ! grep -Eq '(^|[[:space:]])ERR[[:space:]]|0 commits scanned' "$RUNNER_TEMP/gitleaks.log"
          grep -Eq '[1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.2'
      - name: Audit all locked runtime and development dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --require-hashes -r "$RUNNER_TEMP/requirements.txt"
  image:
    name: Container vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag bite-club:security .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: bite-club:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
