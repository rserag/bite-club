name: Bite Club release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish and deploy this main commit after all checks
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bite-club-manual-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_publish)
    uses: ./.github/workflows/ci.yml
  security:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_publish)
    uses: ./.github/workflows/security.yml
  publish:
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Define repository image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Smoke-test the exact published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          bash scripts/container-smoke.sh "$IMAGE"
      - name: Scan the exact published digest before marking it eligible
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
      - name: Record the verified deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Source commit: `%s`\n\nVerified image: `%s@%s`\n\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'SBOM and build provenance are attached to the image. Protected production deployment follows.\n' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: bite-club-production
      cancel-in-progress: false
    steps:
      - name: Install restricted deployment credentials
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Deploy verified immutable image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $IMAGE =~ ^ghcr\.io/rserag/bite-club@sha256:[0-9a-f]{64}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "release $GITHUB_SHA $IMAGE"
      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
