name: Bite Club manual image release
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish this main commit to GHCR after all checks
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bite-club-manual-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish
    uses: ./.github/workflows/ci.yml
  security:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish
    uses: ./.github/workflows/security.yml
  publish:
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Define repository image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan the exact published digest before marking it eligible
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
      - name: Record the verified deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Source commit: `%s`\n\nVerified image: `%s@%s`\n\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'SBOM and build provenance are attached to the image. Deployment remains operator-initiated.\n' >> "$GITHUB_STEP_SUMMARY"
