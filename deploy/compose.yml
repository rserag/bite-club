services:
  bot:
    image: ${BOT_IMAGE:?An immutable image is required}
    init: true
    restart: unless-stopped
    env_file:
      - /opt/bite-club/runtime.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.sqlite3
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  bot-data:
    external: true
    name: nutrition-bot_bot-data
